# The gate AGENTS.md §4 kept asking a person to be: the runner's own exit
# code, on every push, with the summary in the log. `pnpm build` type-checks
# before it bundles (vitest never does), so the deploy's own failure mode —
# a bad cast that passed every test and broke the Pages build — is caught
# here first. The layout probe is not in this job: it needs a Chrome and a
# box whose speed is part of its 150 s ceiling (layout/PROBE-RULES.md
# "Budget"), so it runs on demand below and never blocks a push.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager"; nothing pinned twice.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Manual only. The probe's runtime ceiling is a property of the matrix AND
  # of the machine; a shared runner is not the box the budget was set on, so a
  # red `runtime:` line here would say nothing about the diff. Run it to see
  # the geometry rules on a second browser, not to gate a merge.
  layout:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:layout
