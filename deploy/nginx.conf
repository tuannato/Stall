# Stall — server block for the origin that will hold wallet seeds.
#
# THIS FILE IS A SPECIFICATION, NOT EVIDENCE. Nothing in this repository
# deploys it, and a green test suite does not mean any origin sends these
# headers. Confirm against the live origin before trusting it: the CSP header
# must arrive on the document, and /s/<seller> must answer HTTP 200.
#
# Two requirements are not style. Both come from CLAUDE.md:
#   1. CSP must be a response header. A <meta> tag silently drops
#      frame-ancestors.
#   2. /s/* must be index.html at HTTP 200. A 404 fallback is a shop that
#      crawlers and link unfurlers read as gone.
#
# The origin is a product decision. Stage 2 creates wallets in storage scoped
# to whatever origin serves the app, and nothing migrates them, so the domain
# must be final before the first wallet exists. www redirects to the apex for
# that reason: two origins would mean two separate wallet stores.

server {
    listen 80;
    listen [::]:80;
    server_name stall.cash www.stall.cash;
    return 301 https://stall.cash$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.stall.cash;

    ssl_certificate     /etc/letsencrypt/live/stall.cash/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stall.cash/privkey.pem;

    return 301 https://stall.cash$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stall.cash;

    ssl_certificate     /etc/letsencrypt/live/stall.cash/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stall.cash/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    root /var/www/stall;
    index index.html;

    # ecash-lib emits a separate .wasm asset that is fetched and streamed.
    # Without this type the wasm-bindgen glue still loads it, through a slower
    # non-streaming path and a console warning. Correct it here rather than
    # living with the fallback.
    types {
        application/wasm wasm;
    }

    # Hashed filenames, so the content at a given URL never changes.
    location /assets/ {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # No SPA fallback here: a missing asset is a 404, never index.html
        # served as JavaScript.
        try_files $uri =404;
    }

    # The streamer guide is a static document, not the app. Named so a
    # request for /stream does not fall through to index.html. no-store:
    # a cached guide would keep a stale recipe after a figure moves.
    location = /stream {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /stream.html =404;
    }

    location = /stream.css {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The general guide: the same shape as /stream, for the same reasons.
    location = /guide {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /guide.html =404;
    }

    location = /guide.css {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # The document loads the code that will handle a seed. If it is cached, a
    # patched build does not reach the people running the unpatched one, and
    # they keep executing it. no-store, not no-cache: no-cache still permits a
    # stale copy to be served while it revalidates.
    location / {
        include /etc/nginx/snippets/stall-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
