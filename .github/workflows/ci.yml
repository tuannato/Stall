# The gate AGENTS.md section 4 kept asking a person to be: the runner's own exit
# code, on every push, with the summary in the log. `pnpm build` type-checks
# before it bundles (vitest never does), so the deploy's own failure mode,
# a bad cast that passed every test and broke the Pages build, is caught
# here first. The layout probe is not in this job: it needs a Chrome and a
# box whose speed is part of its 300 s ceiling (layout/PROBE-RULES.md
# "Budget"), so it runs on demand below and never blocks a push.
#
# pnpm comes from corepack, pinned by `packageManager` in package.json: no
# third-party action for it, and nothing pinned twice. The two GitHub actions
# are the v5 lines, which target the Node 24 runtime the runners now force.
#
# This file holds no key: no Environment, no secret, a token that reads the
# repository and nothing more, and no trigger but push, pull_request and
# workflow_dispatch. Every Environment's branch rule answers any workflow
# file on `main`, so scripts/deploy-workflow.test.mjs holds that, every
# line here to printable ASCII and the same closed subset of YAML as
# deploy.yml, and .github/workflows/ to this file and deploy.yml alone.
# Every install skips pnpm's hook file (`--ignore-pnpmfile`), as the deploy
# road's do.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `pnpm test` holds src/looks empty in every commit on no origin/* ref
      # (scripts/licence-map.test.mjs), and refuses a shallow clone or one
      # with no origin/main: the whole history, then origin/main fetched by
      # name, since a pull_request checkout sits on the merge ref.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 turns dependency caching on by default and
          # detects pnpm from `packageManager`, then runs `pnpm store
          # path` before pnpm exists on the runner ("Unable to locate
          # executable file: pnpm"). pnpm arrives from corepack in the
          # next step, so the cache is off; an install from the registry
          # costs a minute and pins nothing twice.
          package-manager-cache: false
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm build
      - run: pnpm test

  # Manual only. The probe's runtime ceiling is a property of the matrix AND
  # of the machine; a shared runner is not the box the budget was set on, so a
  # red `runtime:` line here would say nothing about the diff. Run it to see
  # the geometry rules on a second browser, not to gate a merge.
  layout:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The geometry passes and the contrast pass walk on this many tabs of one
    # Chrome. Two here, set rather than left to the machine rule in
    # layout-check.mjs. Measured on the owner's Mac, each figure from its own
    # run: one tab 261.8-264.1s before the four off-size wall passes landed,
    # against the probe's 300s ceiling; those four passes' own times sum to
    # 64.8s in one geometry walk; a quiet two-tab pair read 230.2s for the
    # branch against 208.8s for main (+21.4s), a loaded one 248.1s against
    # 208.4s (+39.7s). One tab would likely cross the ceiling with the passes
    # (one tab with them was not measured); two tabs fit. A standard
    # ubuntu-latest runner of a public repository has 4 vCPU and 16 GB, which
    # meets the runner's own two-tab default (4 cores, 8 GiB), so this is what
    # the machine rule would pick; it is written out so the count does not
    # move with the image (a runner with fewer cores would take one tab by
    # that rule, and this line would override it). Not measured on a runner:
    # the first manual dispatch is the measurement (layout/PROBE-RULES.md,
    # "CI's layout job on two tabs", "The contrast pass walks on two tabs" and
    # "The geometry passes walk on two tabs").
    env:
      LAYOUT_CONTRAST_TABS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 turns dependency caching on by default and
          # detects pnpm from `packageManager`, then runs `pnpm store
          # path` before pnpm exists on the runner ("Unable to locate
          # executable file: pnpm"). pnpm arrives from corepack in the
          # next step, so the cache is off; an install from the registry
          # costs a minute and pins nothing twice.
          package-manager-cache: false
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      # The probe holds a CJK sign line to a CJK face
      # (`a-cjk-name-is-set-in-a-cjk-face`). The app serves none, so the
      # runner must carry one, or every Linux run is red for its environment
      # rather than for the diff; whether the image already ships one is not
      # something this file can know.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm test:layout
