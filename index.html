<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stall</title>
    <meta
      name="description"
      content="A shop page for one seller's listings on eCash Agora. Stall reads the chain and holds no keys."
    />
    <meta name="theme-color" content="#0a1b33" />
    <!-- The shipped logo, extracted to a transparent hexagon, so it reads on
         any browser-tab background. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Google draws a site's icon in results only from a square PNG whose
         side is a multiple of 48, or an SVG; 16 and 32 alone leave the
         generic globe (measured on the live result 2026-09-02). The three
         below are downscales of the 180px touch icon, never an upscale.
         favicon.ico at the root answers crawlers that ask for it blindly
         (it was a 404). Test: the-home-ships-a-favicon-google-can-show. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Warm the data path while the script downloads: the first chronik
         request otherwise pays DNS+TLS *after* boot, inside the one stage
         everything else waits on. First host only — constructor order is the
         failover order, so the others are usually never dialled. `crossorigin`
         matches the anonymous CORS pool fetch/axios use; the icon host serves
         plain <img> (no-cors), so its preconnect must not carry it. Fonts are
         deliberately not preloaded: only Modern's stack downloads Inter, and
         an unconditional preload would tax every Neo and Rural stall 48KB. -->
    <link rel="preconnect" href="https://chronik-native1.fabien.cash" crossorigin />
    <link rel="preconnect" href="https://api.coingecko.com" crossorigin />
    <link rel="preconnect" href="https://icons.stall.cash" />
    <!-- Open Graph / Twitter. Without a wallet the shared link is the whole
         product (CLAUDE.md §9), so the unfurl has to say what the page is.
         The image is the shipped lockup at the platform-standard 1200x630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stall" />
    <meta property="og:title" content="Stall — eCash Agora" />
    <meta
      property="og:description"
      content="A shop page for one seller's listings on eCash Agora. Stall reads the chain and holds no keys."
    />
    <meta property="og:url" content="https://stall.cash/" />
    <meta property="og:image" content="https://stall.cash/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stall — eCash Agora" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stall — eCash Agora" />
    <meta
      name="twitter:description"
      content="A shop page for one seller's listings on eCash Agora. Stall reads the chain and holds no keys."
    />
    <meta name="twitter:image" content="https://stall.cash/og-image.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
