# Response headers for the Stall origin. Included from every location block,
# because nginx discards a server-level add_header the moment any location sets
# one of its own. One source, repeated by include rather than by hand.
#
# The CSP string is a copy of the CSP constant exported by vite.config.ts.
# src/csp.test.ts fails when the two drift.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'none'; connect-src 'self' https://chronik-native1.fabien.cash https://chronik-native2.fabien.cash https://chronik-native3.fabien.cash; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# frame-ancestors already says this; X-Frame-Options covers clients that
# predate it.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# A stall path carries the seller's key or address. Never leak it to whatever
# a visitor clicks through to.
add_header Referrer-Policy "no-referrer" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), display-capture=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Not preload: that is a one-way door and hosting is not settled. Not
# includeSubDomains until every hostname under the apex is HTTPS-only.
add_header Strict-Transport-Security "max-age=63072000" always;
